  window.catalogo_de_servicos_somenteDisponivel = false;
  window.catalogo_de_servicos_filtrosAbertos = false;

  function catalogo_de_servicos_renderEstrelas(nota) {
    var estrelas = '';
    var cheias = Math.floor(nota);
    var meia = nota - cheias >= 0.5;
    for (var i = 0; i < cheias; i++) estrelas += '<svg class="w-3.5 h-3.5 text-amber-400 fill-current" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>';
    if (meia) estrelas += '<svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 20 20"><defs><linearGradient id="half"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="#D1D5DB"/></linearGradient></defs><path fill="url(#half)" stroke="currentColor" stroke-width="0.5" d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>';
    var vazias = 5 - cheias - (meia ? 1 : 0);
    for (var j = 0; j < vazias; j++) estrelas += '<svg class="w-3.5 h-3.5 text-gray-300 fill-current" viewBox="0 0 20 20"><path d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"/></svg>';
    return estrelas;
  }

  function catalogo_de_servicos_ehFavorito(id) {
    return window.catalogo_de_servicos_favoritos.indexOf(id) !== -1;
  }

  function catalogo_de_servicos_toggleFavorito(e, id) {
    e.stopPropagation();
    var idx = window.catalogo_de_servicos_favoritos.indexOf(id);
    var profissional = profissionais.find(function(p) { return p.id === id; });
    if (idx === -1) {
      window.catalogo_de_servicos_favoritos.push(id);
      toast(profissional.nome + ' adicionado aos favoritos', 'ok');
    } else {
      window.catalogo_de_servicos_favoritos.splice(idx, 1);
      toast(profissional.nome + ' removido dos favoritos', 'info');
    }
    localStorage.setItem('mkt_favoritos', JSON.stringify(window.catalogo_de_servicos_favoritos));
    catalogo_de_servicos_aplicarFiltros();
  }

  function catalogo_de_servicos_getFiltrados() {
    var termo = (document.getElementById('catalogo-busca').value || '').toLowerCase().trim();
    return profissionais.filter(function(p) {
      if (window.catalogo_de_servicos_categoria !== 'todos' && p.categoria !== window.catalogo_de_servicos_categoria) return false;
      if (p.nota < window.catalogo_de_servicos_avaliacaoMin) return false;
      if (window.catalogo_de_servicos_somenteDisponivel && !p.disponivel) return false;
      if (window.catalogo_de_servicos_precoFaixa === 'ate150' && p.precoHora > 150) return false;
      if (window.catalogo_de_servicos_precoFaixa === '150a300' && (p.precoHora < 150 || p.precoHora > 300)) return false;
      if (window.catalogo_de_servicos_precoFaixa === 'acima300' && p.precoHora <= 300) return false;
      if (termo) {
        var textoBusca = (p.nome + ' ' + p.especialidade + ' ' + p.tags.join(' ') + ' ' + p.bio).toLowerCase();
        if (textoBusca.indexOf(termo) === -1) return false;
      }
      return true;
    }).sort(function(a, b) {
      if (window.catalogo_de_servicos_ordenacao === 'menor-preco') return a.precoHora - b.precoHora;
      if (window.catalogo_de_servicos_ordenacao === 'maior-preco') return b.precoHora - a.precoHora;
      if (window.catalogo_de_servicos_ordenacao === 'maior-nota') return b.nota - a.nota;
      if (window.catalogo_de_servicos_ordenacao === 'mais-avaliacoes') return b.avaliacoes - a.avaliacoes;
      return b.sessoes - a.sessoes;
    });
  }

  function catalogo_de_servicos_renderCards(lista) {
    var grid = document.getElementById('catalogo-grid');
    var vazio = document.getElementById('catalogo-vazio');
    var contador = document.getElementById('catalogo-resultados-contador');
    if (!grid) return;
    contador.textContent = lista.length + ' profissional' + (lista.length !== 1 ? 'is' : '') + ' encontrado' + (lista.length !== 1 ? 's' : '');
    if (lista.length === 0) {
      grid.classList.add('hidden');
      vazio.classList.remove('hidden');
      return;
    }
    grid.classList.remove('hidden');
    vazio.classList.add('hidden');
    var html = '';
    lista.forEach(function(p) {
      var fav = catalogo_de_servicos_ehFavorito(p.id);
      var statusHtml = p.disponivel
        ? '<span class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 bg-emerald-500 rounded-full"></span>Disponível</span>'
        : '<span class="inline-flex items-center gap-1 text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full"><span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>Agenda fechada</span>';
      html += '<div class="card bg-white rounded-xl border border-marca-200 shadow-sm overflow-hidden cursor-pointer hover:shadow-md hover:-translate-y-0.5 transition-all duration-200" onclick="mostrarTela(\'detalhe-do-profissional\')">' +
        '<div class="p-3.5">' +
          '<div class="flex items-start gap-3">' +
            '<div class="relative shrink-0">' +
              '<div class="w-12 h-12 ' + p.avatarCor + ' rounded-full flex items-center justify-center text-white font-bold text-sm shadow-sm">' + p.avatar + '</div>' +
              (p.disponivel ? '<span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 bg-emerald-500 border-2 border-white rounded-full"></span>' : '') +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<h3 class="font-display text-sm font-bold text-marca-900 truncate leading-tight">' + p.nome + '</h3>' +
              '<p class="text-xs text-marca-500 mt-0.5 leading-snug">' + p.especialidade + '</p>' +
              '<div class="flex items-center gap-1 mt-1">' + catalogo_de_servicos_renderEstrelas(p.nota) + '</div>' +
            '</div>' +
            '<button onclick="catalogo_de_servicos_toggleFavorito(event, ' + p.id + ')" class="shrink-0 p-1.5 rounded-lg hover:bg-marca-50 transition-colors active:scale-90" title="Favoritar">' +
              (fav
                ? '<svg class="w-5 h-5 text-rose-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>'
                : '<svg class="w-5 h-5 text-marca-300 hover:text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>'
              ) +
            '</button>' +
          '</div>' +
          '<div class="mt-3 flex items-center justify-between">' +
            statusHtml +
            '<div class="text-right">' +
              '<span class="text-lg font-bold text-marca-900 font-display">' + brl(p.precoHora) + '</span>' +
              '<span class="text-[10px] text-marca-500 font-body">/hora</span>' +
            '</div>' +
          '</div>' +
          '<div class="mt-3 flex items-center gap-1 text-[10px] text-marca-400">' +
            '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
            p.avaliacoes + ' avaliações' +
          '</div>' +
          '<button onclick="event.stopPropagation(); mostrarTela(\'detalhe-do-profissional\')" class="mt-3 w-full py-2 bg-marca-900 text-white text-xs font-bold rounded-lg active:scale-95 transition-all hover:bg-marca-800">Ver perfil</button>' +
        '</div>' +
      '</div>';
    });
    grid.innerHTML = html;
  }

  window.catalogo_de_servicos_buscar = function(valor) {
    catalogo_de_servicos_aplicarFiltros();
  };

  window.catalogo_de_servicos_selecionarCategoria = function(cat) {
    window.catalogo_de_servicos_categoria = cat;
    document.querySelectorAll('.catalogo-chip').forEach(function(el) {
      if (el.dataset.cat === cat) {
        el.classList.remove('bg-marca-100', 'text-marca-700');
        el.classList.add('bg-marca-900', 'text-white');
      } else {
        el.classList.remove('bg-marca-900', 'text-white');
        el.classList.add('bg-marca-100', 'text-marca-700');
      }
    });
    catalogo_de_servicos_aplicarFiltros();
  };

  window.catalogo_de_servicos_filtroAvaliacao = function(nota) {
    window.catalogo_de_servicos_avaliacaoMin = nota;
    document.querySelectorAll('.catalogo-av-btn').forEach(function(el) {
      if (parseFloat(el.dataset.av) === nota) {
        el.classList.remove('bg-marca-100', 'text-marca-700', 'hover:bg-marca-200');
        el.classList.add('bg-marca-900', 'text-white');
      } else {
        el.classList.remove('bg-marca-900', 'text-white');
        el.classList.add('bg-marca-100', 'text-marca-700');
      }
    });
    catalogo_de_servicos_aplicarFiltros();
  };

  window.catalogo_de_servicos_filtroPreco = function(faixa) {
    window.catalogo_de_servicos_precoFaixa = faixa;
    document.querySelectorAll('.catalogo-preco-btn').forEach(function(el) {
      if (el.dataset.preco === faixa) {
        el.classList.remove('bg-marca-100', 'text-marca-700', 'hover:bg-marca-200');
        el.classList.add('bg-marca-900', 'text-white');
      } else {
        el.classList.remove('bg-marca-900', 'text-white');
        el.classList.add('bg-marca-100', 'text-marca-700');
      }
    });
    catalogo_de_servicos_aplicarFiltros();
  };

  window.catalogo_de_servicos_toggleDisponibilidade = function() {
    window.catalogo_de_servicos_somenteDisponivel = !window.catalogo_de_servicos_somenteDisponivel;
    var btn = document.getElementById('catalogo-toggle-disponibilidade');
    var circle = btn.querySelector('span');
    if (window.catalogo_de_servicos_somenteDisponivel) {
      btn.classList.remove('bg-marca-200');
      btn.classList.add('bg-marca-600');
      circle.style.transform = 'translateX(20px)';
    } else {
      btn.classList.remove('bg-marca-600');
      btn.classList.add('bg-marca-200');
      circle.style.transform = 'translateX(0)';
    }
    btn.dataset.ativo = window.catalogo_de_servicos_somenteDisponivel ? 'true' : 'false';
    catalogo_de_servicos_aplicarFiltros();
  };

  window.catalogo_de_servicos_toggleFiltro = function() {
    window.catalogo_de_servicos_filtrosAbertos = !window.catalogo_de_servicos_filtrosAbertos;
    var painel = document.getElementById('catalogo-filtros-painel');
    var contador = document.getElementById('catalogo-filtro-contador');
    if (window.catalogo_de_servicos_filtrosAbertos) {
      painel.classList.remove('hidden');
      painel.classList.add('animate-fade-in');
    } else {
      painel.classList.add('hidden');
    }
    var ativos = 0;
    if (window.catalogo_de_servicos_categoria !== 'todos') ativos++;
    if (window.catalogo_de_servicos_avaliacaoMin > 0) ativos++;
    if (window.catalogo_de_servicos_precoFaixa !== 'todos') ativos++;
    if (window.catalogo_de_servicos_somenteDisponivel) ativos++;
    if (ativos > 0) {
      contador.classList.remove('hidden');
      contador.classList.add('flex');
      contador.textContent = ativos;
    } else {
      contador.classList.add('hidden');
      contador.classList.remove('flex');
    }
  };

  window.catalogo_de_servicos_limparFiltros = function() {
    window.catalogo_de_servicos_categoria = 'todos';
    window.catalogo_de_servicos_avaliacaoMin = 0;
    window.catalogo_de_servicos_precoFaixa = 'todos';
    window.catalogo_de_servicos_somenteDisponivel = false;
    document.getElementById('catalogo-busca').value = '';
    catalogo_de_servicos_selecionarCategoria('todos');
    catalogo_de_servicos_filtroAvaliacao(0);
    catalogo_de_servicos_filtroPreco('todos');
    var btn = document.getElementById('catalogo-toggle-disponibilidade');
    var circle = btn.querySelector('span');
    btn.classList.remove('bg-marca-600');
    btn.classList.add('bg-marca-200');
    circle.style.transform = 'translateX(0)';
    btn.dataset.ativo = 'false';
    toast('Filtros limpos com sucesso', 'info');
    catalogo_de_servicos_aplicarFiltros();
  };

  window.catalogo_de_servicos_ordenar = function() {
    var opcoes = ['relevancia', 'menor-preco', 'maior-preco', 'maior-nota', 'mais-avaliacoes'];
    var labels = ['Relevância', 'Menor preço', 'Maior preço', 'Maior nota', 'Mais avaliações'];
    var idx = opcoes.indexOf(window.catalogo_de_servicos_ordenacao);
    idx = (idx + 1) % opcoes.length;
    window.catalogo_de_servicos_ordenacao = opcoes[idx];
    catalogo_de_servicos_aplicarFiltros();
    toast('Ordenado por: ' + labels[idx], 'info');
  };

  function catalogo_de_servicos_aplicarFiltros() {
    var lista = catalogo_de_servicos_getFiltrados();
    catalogo_de_servicos_renderCards(lista);
  }

  window.catalogo_de_servicos_init = function() {
    catalogo_de_servicos_aplicarFiltros();
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', catalogo_de_servicos_init);
  } else {
    catalogo_de_servicos_init();
  }
})();
</script>

  <div id="modal-overlay" class="fixed inset-0 z-[100] hidden bg-black/50 backdrop-blur-sm" onclick="fecharModal()">
    <div id="modal-card" class="bg-white rounded-2xl w-[calc(100%-32px)] max-w-[358px] max-h-[75vh] flex flex-col m-auto absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 shadow-toast overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-neutro-200 shrink-0">
        <h3 id="modal-title" class="font-display text-lg font-semibold text-marca-900">Título</h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-neutro-100 transition-colors text-neutro-500" aria-label="Fechar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto"></div>
      <div class="px-5 py-3 border-t border-neutro-200 shrink-0">
        <button onclick="fecharModal()" class="btn btn-primary w-full text-sm py-3">Fechar</button>
      </div>
    </div>
  </div>
</div>

<script>
function mostrarTela(id) {
  document.querySelectorAll('[data-tela]').forEach(function(s) { s.classList.toggle('hidden', s.dataset.tela !== id); });
  document.querySelectorAll('[data-nav]').forEach(function(b) { b.classList.toggle('ativo', b.dataset.nav === id); });
  window.scrollTo({ top: 0 });
}
document.addEventListener('DOMContentLoaded', function() { mostrarTela('catalogo-de-servicos'); });

function brl(valor) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor); }
function dataBR(iso) { if (!iso) return ''; var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('pt-BR'); }

var toastTimer;
function toast(msg, tipo) {
  var c = document.getElementById('toast-container');
  var iconMap = { ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>', erro: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>', info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2d4380" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' };
  var bgMap = { ok: '#f0f9f0', erro: '#fef2f2', info: '#f0f3fa' };
  var el = document.createElement('div');
  el.className = 'toast-item flex items-center gap-3 px-4 py-3 rounded-xl shadow-toast';
  el.style.background = bgMap[tipo] || bgMap.info;
  el.innerHTML = '<div class="shrink-0">' + (iconMap[tipo] || iconMap.info) + '</div><span class="text-sm font-medium text-neutro-800 flex-1">' + msg + '</span>';
  c.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.add('removing'); setTimeout(function() { el.remove(); }, 220); }, 3000);
}

function abrirModal(html, titulo) {
  var overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = titulo || '';
  document.getElementById('modal-body').innerHTML = html;
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function fecharModal() {
  var overlay = document.getElementById('modal-overlay');
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') fecharModal(); });
</script>

</body>
</html>
