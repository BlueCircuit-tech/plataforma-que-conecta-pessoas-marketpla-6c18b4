<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #1a1d28; }
    [data-tela]:not(.hidden) { animation: fadeSlide .28s ease-out; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-16px) scale(.96); } }
    @keyframes modalBg { from { opacity: 0; } to { opacity: 1; } }

    .nav-btn { position: relative; transition: color .2s ease; }
    .nav-btn .nav-dot { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: #c9951a; opacity: 0; transition: opacity .2s ease; }
    .ativo .nav-dot { opacity: 1; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(11,21,52,.06), 0 4px 16px rgba(11,21,52,.04); border: 1px solid #e2e4ec; }
    .card-interactive { transition: box-shadow .2s ease, transform .15s ease; }
    .card-interactive:active { transform: scale(.985); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 24px; border-radius: 10px; font-family: 'Source Sans 3', system-ui, sans-serif; font-weight: 600; font-size: 15px; transition: opacity .15s ease, transform .1s ease; cursor: pointer; border: none; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(135deg, #2d4380, #3b54a0); color: #fff; }
    .btn-accent { background: linear-gradient(135deg, #c9951a, #e2b03b); color: #0b1534; }
    .btn-outline { background: transparent; color: #2d4380; border: 1.5px solid #2d4380; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-success { background: #f0f9f0; color: #1a6b3c; }
    .badge-warning { background: #fdf8ef; color: #a87914; }
    .badge-info { background: #f0f3fa; color: #2d4380; }
    .badge-danger { background: #fef2f2; color: #c53030; }
    .device-frame { max-width: 390px; margin: 0 auto; min-height: 100dvh; }
    @media (min-width: 768px) {
      .device-frame { min-height: auto; border-radius: 36px; border: 6px solid #2a2d3a; margin-top: 24px; margin-bottom: 24px; max-height: 844px; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,.45); }
    }
    #toast-container { pointer-events: none; }
    .toast-item { pointer-events: auto; animation: toastIn .28s ease-out forwards; }
    .toast-item.removing { animation: toastOut .22s ease-in forwards; }
    #modal-overlay { animation: modalBg .2s ease-out forwards; }
    #modal-card { animation: modalCard .28s ease-out forwards; }
    .avatar { display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 700; flex-shrink: 0; }
    .skeleton { background: linear-gradient(90deg, #f0f1f5 25%, #e2e4ec 50%, #f0f1f5 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .input-field { width: 100%; padding: 14px 16px; border: 1.5px solid #e2e4ec; border-radius: 10px; font-family: 'Source Sans 3', system-ui, sans-serif; font-size: 15px; transition: border-color .2s ease, box-shadow .2s ease; background: #fff; color: #141519; }
    .input-field:focus { outline: none; border-color: #2d4380; box-shadow: 0 0 0 3px rgba(45,67,128,.1); }
    .section-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }
    .search-bar { display: flex; align-items: center; gap: 10px; background: #f0f1f5; border-radius: 10px; padding: 0 14px; }
    .search-bar input { background: transparent; border: none; padding: 13px 0; font-size: 15px; font-family: 'Source Sans 3', system-ui, sans-serif; width: 100%; }
    .search-bar input:focus { outline: none; }

<script>
function mostrarTela(id) {
  document.querySelectorAll('[data-tela]').forEach(function(s) { s.classList.toggle('hidden', s.dataset.tela !== id); });
  document.querySelectorAll('[data-nav]').forEach(function(b) { b.classList.toggle('ativo', b.dataset.nav === id); });
  window.scrollTo({ top: 0 });
}
document.addEventListener('DOMContentLoaded', function() { mostrarTela('catalogo-de-servicos'); });

function brl(valor) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor); }
function dataBR(iso) { if (!iso) return ''; var d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('pt-BR'); }

var toastTimer;
function toast(msg, tipo) {
  var c = document.getElementById('toast-container');
  var iconMap = { ok: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>', erro: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>', info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2d4380" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' };
  var bgMap = { ok: '#f0f9f0', erro: '#fef2f2', info: '#f0f3fa' };
  var el = document.createElement('div');
  el.className = 'toast-item flex items-center gap-3 px-4 py-3 rounded-xl shadow-toast';
  el.style.background = bgMap[tipo] || bgMap.info;
  el.innerHTML = '<div class="shrink-0">' + (iconMap[tipo] || iconMap.info) + '</div><span class="text-sm font-medium text-neutro-800 flex-1">' + msg + '</span>';
  c.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.add('removing'); setTimeout(function() { el.remove(); }, 220); }, 3000);
}

function abrirModal(html, titulo) {
  var overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = titulo || '';
  document.getElementById('modal-body').innerHTML = html;
  overlay.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function fecharModal() {
  var overlay = document.getElementById('modal-overlay');
  overlay.classList.add('hidden');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') fecharModal(); });
</script>
